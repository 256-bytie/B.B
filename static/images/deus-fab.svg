<svg xmlns="http://www.w3.org/2000/svg" width="1402" height="1122" viewBox="0 0 1402 1122">
<title>Robot mascot head and ears</title>
<desc>Scalable vector illustration of a friendly robot head with blue triangular ears, a dark rounded display face, eyes, smile and cheek marks.</desc>
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#f8faff"/><stop offset="1" stop-color="#dce2ef"/></linearGradient>
