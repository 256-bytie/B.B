<!-- BEGIN: Course file dialogs: save/rename dialog, file options sheet, delete confirm.
     Logic in courses.js. The save dialog appears right after a file is picked:
     the name is editable (extension fixed), or Save keeps it as is. -->

<div id="course-file-dialog" class="hidden fixed inset-0 z-[59] flex items-center justify-center px-6" role="dialog" aria-modal="true" aria-labelledby="course-file-dialog-title">
	<div class="absolute inset-0 bg-black/50" onclick="closeCourseFileDialog()"></div>
	<div class="relative w-full max-w-[380px] bg-white rounded-[28px] px-6 pt-7 pb-5 shadow-2xl">
		<h2 id="course-file-dialog-title" class="text-[24px] leading-8 text-gray-900">Save file</h2>
		<div class="relative mt-6">
			<label for="course-file-name" class="absolute -top-2.5 left-3 px-1 bg-white text-[13px] text-sky-600 z-[1]">Name</label>
			<div class="flex items-center h-14 rounded-xl border-2 border-sky-400">
				<input id="course-file-name" type="text" maxlength="100" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" class="flex-1 min-w-0 h-full px-4 bg-transparent border-0 text-[16px] text-gray-900 outline-none focus:ring-0" oninput="onCourseFileNameInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();submitCourseFileDialog();}">
				<span id="course-file-ext" class="shrink-0 pr-4 text-[16px] text-gray-500"></span>
			</div>
		</div>
		<p id="course-file-helper" class="text-[13px] text-gray-500 mt-2 px-3 break-words">*required</p>
		<div id="course-file-progress" class="hidden mt-3 mx-3 h-1.5 rounded-full bg-gray-100 overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100">
			<div id="course-file-progress-bar" class="h-full rounded-full bg-sky-500" style="width: 0%; transition: width 120ms linear;"></div>
		</div>
		<div class="flex justify-end items-center gap-2 mt-8">
			<button type="button" class="px-4 h-11 rounded-full text-[15px] font-semibold text-sky-600 active:bg-gray-100 transition-colors" onclick="closeCourseFileDialog()">Cancel</button>
			<button type="button" id="course-file-submit" class="course-dialog-submit px-4 h-11 rounded-full text-[15px] font-semibold transition-colors" disabled onclick="submitCourseFileDialog()">Save</button>
		</div>
	</div>
</div>

<div id="course-file-menu-backdrop" class="hidden fixed inset-0 z-40 bg-black/20" onclick="closeCourseFileMenu();closeCourseFileCategorySheet();closeCourseFolderMenu()"></div>
<div id="course-file-menu-sheet" class="hidden fixed left-0 right-0 bottom-0 z-[59] bg-white rounded-t-[24px] shadow-[0_-8px_24px_rgba(0,0,0,0.12)] pt-2 pb-6 max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="File options">
	<div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-2"></div>
	<p id="course-file-menu-title" class="px-5 pt-1 pb-2 text-[14px] font-semibold text-gray-500 truncate"></p>
	<div class="py-1">
		<button type="button" class="group w-full flex items-center gap-4 px-5 py-3.5 text-left transition-colors duration-100 active:bg-gray-50" onclick="courseFileMenuAction('rename')">
			<span class="w-6 flex items-center justify-center text-gray-700"><i class="fa-solid fa-pencil text-[18px]"></i></span>
			<span class="text-[15px] font-medium text-gray-900">Rename</span>
		</button>
		<!-- Only offered for files at the top level (see openCourseFileMenu) -->
		<button type="button" id="course-file-menu-category" class="group w-full flex items-center gap-4 px-5 py-3.5 text-left transition-colors duration-100 active:bg-gray-50" onclick="courseFileMenuAction('category')">
			<span class="w-6 flex items-center justify-center text-gray-700"><i class="fa-solid fa-tag text-[18px]"></i></span>
			<span class="text-[15px] font-medium text-gray-900">Category</span>
		</button>
		<button type="button" class="group w-full flex items-center gap-4 px-5 py-3.5 text-left transition-colors duration-100 active:bg-gray-50" onclick="courseFileMenuAction('download')">
			<span class="w-6 flex items-center justify-center text-gray-700"><i class="fa-solid fa-download text-[18px]"></i></span>
			<span class="text-[15px] font-medium text-gray-900">Download</span>
		</button>
		<button type="button" class="group w-full flex items-center gap-4 px-5 py-3.5 text-left transition-colors duration-100 active:bg-gray-50" onclick="courseFileMenuAction('delete')">
			<span class="w-6 flex items-center justify-center text-red-600"><i class="fa-regular fa-trash-can text-[18px]"></i></span>
			<span class="text-[15px] font-medium text-red-600">Delete</span>
		</button>
	</div>
	<div class="border-t border-gray-100 pt-2 px-3">
		<button type="button" onclick="closeCourseFileMenu()" class="w-full py-3.5 text-center text-[15px] font-semibold text-gray-500 rounded-xl transition-colors duration-100 active:bg-gray-100">Cancel</button>
	</div>
</div>

<div id="course-folder-menu-sheet" class="hidden fixed left-0 right-0 bottom-0 z-[59] bg-white rounded-t-[24px] shadow-[0_-8px_24px_rgba(0,0,0,0.12)] pt-2 pb-6 max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="Folder options">
	<div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-2"></div>
	<p id="course-folder-menu-title" class="px-5 pt-1 pb-2 text-[14px] font-semibold text-gray-500 truncate"></p>
	<div class="py-1">
		<button type="button" class="group w-full flex items-center gap-4 px-5 py-3.5 text-left transition-colors duration-100 active:bg-gray-50" onclick="courseFolderMenuAction('rename')">
			<span class="w-6 flex items-center justify-center text-gray-700"><i class="fa-solid fa-pencil text-[18px]"></i></span>
			<span class="text-[15px] font-medium text-gray-900">Rename</span>
		</button>
		<button type="button" class="group w-full flex items-center gap-4 px-5 py-3.5 text-left transition-colors duration-100 active:bg-gray-50" onclick="courseFolderMenuAction('delete')">
			<span class="w-6 flex items-center justify-center text-red-600"><i class="fa-regular fa-trash-can text-[18px]"></i></span>
			<span class="text-[15px] font-medium text-red-600">Delete</span>
		</button>
	</div>
	<div class="border-t border-gray-100 pt-2 px-3">
		<button type="button" onclick="closeCourseFolderMenu()" class="w-full py-3.5 text-center text-[15px] font-semibold text-gray-500 rounded-xl transition-colors duration-100 active:bg-gray-100">Cancel</button>
	</div>
</div>

<div id="course-file-category-sheet" class="hidden fixed left-0 right-0 bottom-0 z-[60] bg-white rounded-t-[24px] shadow-[0_-8px_24px_rgba(0,0,0,0.12)] pt-2 pb-6 max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="Choose a category">
	<div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-2"></div>
	<p class="px-5 pt-1 pb-2 text-[14px] font-semibold text-gray-500">Category</p>
	<div id="course-file-category-options" class="py-1 max-h-[50vh] overflow-y-auto"></div>
	<div class="border-t border-gray-100 pt-2 px-3">
		<button type="button" onclick="closeCourseFileCategorySheet()" class="w-full py-3.5 text-center text-[15px] font-semibold text-gray-500 rounded-xl transition-colors duration-100 active:bg-gray-100">Cancel</button>
	</div>
</div>

<div id="course-confirm-dialog" class="hidden fixed inset-0 z-[60] flex items-center justify-center px-6" role="alertdialog" aria-modal="true" aria-labelledby="course-confirm-title">
	<div class="absolute inset-0 bg-black/50" onclick="closeCourseConfirm()"></div>
	<div class="relative w-full max-w-[380px] bg-white rounded-[28px] px-6 pt-7 pb-5 shadow-2xl">
		<h2 id="course-confirm-title" class="text-[22px] leading-7 text-gray-900">Delete file?</h2>
		<p id="course-confirm-message" class="text-[15px] leading-6 text-gray-600 mt-3 break-words"></p>
		<div class="flex justify-end items-center gap-2 mt-7">
			<button type="button" class="px-4 h-11 rounded-full text-[15px] font-semibold text-sky-600 active:bg-gray-100 transition-colors" onclick="closeCourseConfirm()">Cancel</button>
			<button type="button" id="course-confirm-ok" class="px-4 h-11 rounded-full text-[15px] font-semibold text-red-600 active:bg-gray-100 transition-colors" onclick="confirmCourseDelete()">Delete</button>
		</div>
	</div>
</div>
<!-- END: Course file dialogs -->
