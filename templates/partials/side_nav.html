<!-- BEGIN: Side Navigation Drawer -->
<!-- Tap-to-close area behind the panel. Its opacity is driven by
     side-nav.js in lockstep with the panel's drag position (see
     setSideNavWidth), not by a CSS class, so it can track the finger
     in real time along with the panel. -->
<div id="side-nav-backdrop" class="fixed inset-0 bg-black z-40 opacity-0 pointer-events-none"></div>

<!-- #side-nav is a clipping shell: its WIDTH is driven by side-nav.js and
     animates between two snap points - closed (0) and full (the labeled
     drawer, #side-nav-full). The drawer itself slides in with the shell
     (see setSideNavWidth) so its right edge tracks the finger. -->
<aside id="side-nav" class="fixed top-0 left-0 h-full bg-white z-50 rounded-r-3xl shadow-[4px_0_24px_rgba(0,0,0,0.12)] overflow-hidden" style="width: 0px;">
