<!-- BEGIN: Course Categories editor (opened from Courses > 3-dot > Categories)
     Full-screen "Edit categories" view + the Add/Edit category dialog.
     Logic lives in courses.js. "All" is built in and never listed here, so
     it cannot be edited, reordered or deleted. -->
<div id="course-categories-view" class="hidden fixed inset-y-0 left-0 right-0 z-[58] bg-[#fafafa] max-w-[430px] mx-auto flex flex-col" role="dialog" aria-modal="true" aria-label="Edit categories">
	<header class="flex items-center gap-4 px-4 h-16 shrink-0">
		<button type="button" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-gray-900 active:bg-gray-100 transition-colors" aria-label="Back" onclick="closeCourseCategories()">
			<i class="fa-solid fa-arrow-left text-xl"></i>
		</button>
		<h1 class="text-[22px] font-semibold text-gray-900">Edit categories</h1>
	</header>

	<div class="flex-1 overflow-y-auto px-4 pt-2 pb-32">
		<ul id="course-categories-list" class="space-y-3"></ul>
		<div id="course-categories-empty" class="hidden px-6 pt-24 text-center">
			<p class="text-[17px] font-semibold text-gray-900">No categories yet</p>
			<p class="text-[14px] text-gray-500 mt-1">Tap Add to create your first category.</p>
		</div>
	</div>

	<button type="button" class="course-fab absolute bottom-6 right-5 h-14 pl-5 pr-6 rounded-2xl flex items-center gap-3 text-[16px] font-semibold shadow-lg active:scale-95 transition-transform duration-100" onclick="openCourseCategoryDialog(null)">
		<i class="fa-solid fa-plus text-lg"></i>
		Add
	</button>
</div>

<div id="course-category-dialog" class="hidden fixed inset-0 z-[59] flex items-center justify-center px-6" role="dialog" aria-modal="true" aria-labelledby="course-category-dialog-title">
	<div class="absolute inset-0 bg-black/50" onclick="closeCourseCategoryDialog()"></div>
	<div class="relative w-full max-w-[380px] bg-white rounded-[28px] px-6 pt-7 pb-5 shadow-2xl">
		<h2 id="course-category-dialog-title" class="text-[24px] leading-8 text-gray-900">Add category</h2>
		<div class="relative mt-6">
			<label for="course-category-input" class="absolute -top-2.5 left-3 px-1 bg-white text-[13px] text-sky-600">Name</label>
			<input id="course-category-input" type="text" maxlength="30" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" class="w-full h-14 px-4 rounded-xl border-2 border-sky-400 bg-transparent text-[16px] text-gray-900 outline-none focus:ring-0" oninput="onCourseCategoryInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();submitCourseCategory();}">
		</div>
		<p id="course-category-helper" class="text-[13px] text-gray-500 mt-2 px-3">*required</p>
		<div class="flex justify-end items-center gap-2 mt-8">
			<button type="button" class="px-4 h-11 rounded-full text-[15px] font-semibold text-sky-600 active:bg-gray-100 transition-colors" onclick="closeCourseCategoryDialog()">Cancel</button>
			<button type="button" id="course-category-submit" class="course-dialog-submit px-4 h-11 rounded-full text-[15px] font-semibold transition-colors" disabled onclick="submitCourseCategory()">Add</button>
		</div>
	</div>
</div>
<!-- END: Course Categories editor -->
