<!-- BEGIN: Chat View -->
<div id="chat-view" class="view-section bg-white min-h-screen relative">
	<!-- BEGIN: Main Header -->
	<header class="bg-white sticky top-0 z-10 w-full shadow-sm">
		<div class="flex justify-between items-center px-4 py-2.5">
			<h1 class="text-base font-bold text-gray-900">Chats</h1>
			<div class="flex items-center -mr-2">
				<button id="chat-search-toggle" type="button" class="w-9 h-9 flex items-center justify-center text-gray-500 hover:text-gray-700 focus:outline-none" onclick="toggleChatSearch()" aria-label="Search messages">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
				</button>
				<!-- More options: popover with the Requests entry (opens the Message Requests screen) -->
				<div class="relative">
					<button id="chat-menu-btn" type="button" class="w-9 h-9 flex items-center justify-center text-gray-500 hover:text-gray-700 focus:outline-none" onclick="toggleChatMenu()" aria-label="More options" aria-haspopup="menu" aria-expanded="false">
						<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
							<path d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" stroke-linecap="round" stroke-linejoin="round"></path>
						</svg>
					</button>
					<div id="chat-menu-backdrop" class="hidden fixed inset-0 z-40" onclick="closeChatMenu()"></div>
					<div id="chat-menu-popover" class="hidden absolute z-50 top-full right-0 mt-1 bg-white rounded-xl shadow-[0_8px_24px_rgba(0,0,0,0.16)] border border-gray-100 py-1 w-40 origin-top-right" role="menu">
						<div class="absolute -top-[5px] right-[12px] w-2.5 h-2.5 bg-white border-t border-l border-gray-100 rotate-45"></div>
						<button type="button" id="chat-menu-requests-btn" class="group relative w-full flex items-center gap-2.5 px-3.5 py-2 text-left transition-colors duration-100 active:bg-gray-50" role="menuitem" onclick="openChatRequestsFromMenu()">
							<svg class="w-[18px] h-[18px] text-gray-900 shrink-0 transition-transform duration-150 group-active:scale-90" fill="none" stroke="currentColor" stroke-width="1.75" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" stroke-linecap="round" stroke-linejoin="round"></path>
							</svg>
							<span class="text-[14px] font-medium text-gray-900">Requests</span>
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- All / Unread / Groups filter -->
		<div id="chat-filter-row" class="px-4 pt-2 pb-2">
			<div class="flex bg-gray-100 rounded-full p-0.5" role="tablist" aria-label="Filter messages">
				<button type="button" id="chat-filter-all" role="tab" aria-selected="true" class="flex-1 py-1.5 rounded-full text-[13px] font-semibold bg-white text-gray-900 shadow-sm" onclick="setChatFilter('all')">All</button>
				<button type="button" id="chat-filter-unread" role="tab" aria-selected="false" class="flex-1 py-1.5 rounded-full text-[13px] font-medium text-gray-500" onclick="setChatFilter('unread')">Unread</button>
				<button type="button" id="chat-filter-groups" role="tab" aria-selected="false" class="flex-1 py-1.5 rounded-full text-[13px] font-medium text-gray-500" onclick="setChatFilter('groups')">Groups</button>
			</div>
		</div>

		<!-- Inline search field, hidden by default -->
		<div id="chat-search-row" class="hidden px-4 pt-3 pb-3">
			<div class="flex items-center bg-gray-50 rounded-[12px] px-3 py-2.5">
				<svg class="w-4 h-4 text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<input id="chat-search-input" type="text" class="bg-transparent border-none outline-none text-sm w-full p-0 text-gray-800 placeholder:text-gray-400 focus:ring-0" placeholder="Search messages" oninput="filterChatMessages(this.value)">
			</div>
		</div>
	</header>
	<!-- END: Main Header -->

	<!-- Messages list -->
	<main id="chat-messages-view" class="bg-white">
		<div id="chat-messages-list"></div>
	</main>

	<!-- BEGIN: Chats FAB -->
	<!-- One instance for the whole screen: it lives outside #chat-messages-list, so the
	     All / Unread / Groups tabs and search only re-render the list and never touch it.
	     Same anchor as the feed compose FAB (right 20px, 32px above the bottom nav + safe
	     area, both via --bottom-nav-h). Shown/hidden with the view itself (.view-section).
	     Icon: provided chats-circle.svg (Phosphor "regular"), geometry and viewBox untouched,
	     inlined with fill="currentColor" like the bottom-nav icons so it follows text-white. -->
	<button id="chat-fab" type="button" class="fixed w-14 h-14 bg-brand-red text-white rounded-full card-shadow flex items-center justify-center hover:bg-red-700 transition-colors z-9" style="bottom: calc(var(--bottom-nav-h) + 32px + env(safe-area-inset-bottom, 0px)); right: 20px;" onclick="openChatNewMessage()" aria-label="New chat">
		<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M232.07,186.76a80,80,0,0,0-62.5-114.17A80,80,0,1,0,23.93,138.76l-7.27,24.71a16,16,0,0,0,19.87,19.87l24.71-7.27a80.39,80.39,0,0,0,25.18,7.35,80,80,0,0,0,108.34,40.65l24.71,7.27a16,16,0,0,0,19.87-19.86ZM62,159.5a8.28,8.28,0,0,0-2.26.32L32,168l8.17-27.76a8,8,0,0,0-.63-6,64,64,0,1,1,26.26,26.26A8,8,0,0,0,62,159.5Zm153.79,28.73L224,216l-27.76-8.17a8,8,0,0,0-6,.63,64.05,64.05,0,0,1-85.87-24.88A79.93,79.93,0,0,0,174.7,89.71a64,64,0,0,1,41.75,92.48A8,8,0,0,0,215.82,188.23Z"></path></svg>
	</button>
	<!-- END: Chats FAB -->
</div>
<!-- END: Chat View -->
