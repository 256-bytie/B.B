<!-- BEGIN: Payment Methods View -->
<!-- Opened from the Payment methods row in Settings (openPaymentMethodsView in static/js/settings.js);
     the back arrow returns to Settings. Empty state only for now: no card storage exists yet. -->
<div id="payment-methods-view" class="view-section bg-white min-h-screen flex justify-center">
<main class="w-full max-w-[430px] bg-white min-h-screen relative">

	<!-- BEGIN: Banner -->
	<header class="settings-banner settings-banner--compact">
		<svg class="settings-banner-arcs" viewBox="0 0 430 160" preserveAspectRatio="xMaxYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<circle cx="478" cy="-20" r="300"></circle>
			<circle cx="518" cy="-80" r="272"></circle>
		</svg>
		<button type="button" id="payment-methods-back-btn" class="settings-back-btn" aria-label="Back" onclick="closePaymentMethodsView()">
			<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
		</button>
		<h1 class="settings-title">Payment methods</h1>
	</header>
	<!-- END: Banner -->

	<!-- BEGIN: Empty state -->
	<section class="payment-empty" aria-label="Payment methods">
		<svg class="payment-empty-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.5 4.5h15A2.25 2.25 0 0121.75 6.75v10.5A2.25 2.25 0 0119.5 19.5h-15a2.25 2.25 0 01-2.25-2.25V6.75A2.25 2.25 0 014.5 4.5z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2.25 9.75h19.5M6 14.25h4.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
		<h2 class="payment-empty-title">No payment cards added</h2>
		<p class="payment-empty-text">No cards have been added yet. Do it now to be able to make a payment.</p>
		<button type="button" id="payment-add-card-btn" class="payment-add-btn" onclick="addPaymentCard()">Add new card</button>
	</section>
	<!-- END: Empty state -->

</main>
</div>
<!-- END: Payment Methods View -->
