<!-- Five equal columns (Home / Search / Compose / Chat / Profile),
     icon-only. Icons are the provided Phosphor "regular" SVGs inlined with
     fill="currentColor" so the active/inactive color (and dark mode) come
     from the text-gray-* classes toggled by updateBottomNav() in core.js.
     Hidden by default; core.js shows it only on the views it links to
     (feed, search, chat, profile) - Compose opens the create-post takeover screen,
     same as the feed FAB, so like that FAB it has no active/highlighted
     state of its own. Home's active state adds a filled house behind the
     outline (.bn-active-fill); chat/search embolden with a stroke
     instead. Profile is the odd one out: it's the user's own avatar photo
     rather than a currentColor glyph, styled as a ringed circular button
     (see .bottom-nav-avatar-ring in style.css) - its src is kept in sync
     with the session avatar by updateBottomNavAvatar() in
     comment-actions.js. -->
