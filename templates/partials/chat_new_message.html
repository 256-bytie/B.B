<!-- BEGIN: Chat New Message + New Group Views -->
<!-- Opened by the Chats list FAB (#chat-fab -> openChatNewMessage in chat-new-message.js).
     Two full-screen views (bottom nav hidden: neither is in BOTTOM_NAV_ACTIVE_ITEM):
       #chat-new-message-view  Cancel / "New message" / search / Create a group / user list
       #chat-new-group-view    group name, selected chips, search, selectable user list
     Both user lists are rendered by JS from the user directory (no hardcoded rows). -->
<div id="chat-new-message-view" class="view-section bg-white min-h-screen relative">
	<header class="bg-white sticky top-0 z-10 w-full">
		<div class="relative flex items-center justify-center px-4 py-3">
			<button id="chat-new-message-cancel-btn" type="button" class="absolute left-4 top-1/2 -translate-y-1/2 text-[15px] text-gray-900 active:opacity-60" onclick="closeChatNewMessage()">Cancel</button>
			<h1 class="text-base font-bold text-gray-900">New message</h1>
		</div>
		<div class="px-4 pb-2">
			<div class="flex items-center bg-gray-100 rounded-full px-4 py-2.5">
				<svg class="w-5 h-5 text-gray-500 mr-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<input id="chat-new-message-search" type="text" class="bg-transparent border-none outline-none text-[15px] w-full p-0 text-gray-800 placeholder:text-gray-500 focus:ring-0" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search people by name or username">
			</div>
		</div>
	</header>

	<main class="bg-white">
		<button id="chat-new-message-group-btn" type="button" class="w-full flex items-center px-4 py-3 text-left active:bg-gray-50" onclick="openChatNewGroup()">
			<span class="w-11 h-11 rounded-full bg-gray-200 flex items-center justify-center shrink-0">
				<svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="7" r="2.5"></circle><circle cx="5.5" cy="9.5" r="2"></circle><circle cx="18.5" cy="9.5" r="2"></circle><path d="M8 19v-1.5A3.5 3.5 0 0 1 11.5 14h1a3.5 3.5 0 0 1 3.5 3.5V19"></path><path d="M2.5 17.5v-.5a2.5 2.5 0 0 1 2.5-2.5"></path><path d="M21.5 17.5v-.5a2.5 2.5 0 0 0-2.5-2.5"></path></svg>
			</span>
			<span class="flex-1 ml-3 font-bold text-gray-900 text-[16px]">Create a group</span>
			<svg class="w-5 h-5 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
		</button>
		<div id="chat-new-message-list"></div>
	</main>
</div>

<div id="chat-new-group-view" class="view-section bg-white min-h-screen relative">
	<header class="bg-white sticky top-0 z-10 w-full border-b border-gray-100">
		<div class="relative flex items-center justify-center px-4 py-3">
			<button id="chat-new-group-cancel-btn" type="button" class="absolute left-4 top-1/2 -translate-y-1/2 text-[15px] text-gray-900 active:opacity-60" onclick="closeChatNewGroup()">Cancel</button>
			<h1 class="text-base font-bold text-gray-900">New group</h1>
			<button id="chat-new-group-create-btn" type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-[15px] font-semibold text-brand-red disabled:text-gray-400 disabled:cursor-not-allowed active:opacity-60" onclick="createChatGroup()" disabled>Create</button>
		</div>
		<div class="px-4 pb-2 space-y-2">
			<input id="chat-new-group-name" type="text" maxlength="50" class="w-full bg-gray-100 rounded-full px-4 py-2.5 text-[15px] text-gray-800 placeholder:text-gray-500 border-none outline-none focus:ring-0" placeholder="Group name (optional)" autocomplete="off" aria-label="Group name">
			<div id="chat-new-group-chips" class="hidden flex flex-wrap gap-1.5" aria-label="Selected participants"></div>
			<div class="flex items-center bg-gray-100 rounded-full px-4 py-2.5">
				<svg class="w-5 h-5 text-gray-500 mr-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<input id="chat-new-group-search" type="text" class="bg-transparent border-none outline-none text-[15px] w-full p-0 text-gray-800 placeholder:text-gray-500 focus:ring-0" placeholder="Search people to add" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search people to add">
			</div>
		</div>
	</header>
	<main class="bg-white">
		<p id="chat-new-group-hint" class="px-4 pt-3 pb-1 text-[13px] text-gray-500">Select at least 2 people.</p>
		<div id="chat-new-group-list"></div>
	</main>
</div>
<!-- END: Chat New Message + New Group Views -->
