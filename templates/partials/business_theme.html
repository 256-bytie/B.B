<!-- BEGIN: Business Theme View -->
<!-- Opened from the "Theme" item in the business profile's 3 dot menu (bpOpenTheme,
     static/js/business-theme.js); the back arrow returns to the business profile.
     The chosen accent only themes this business's cards in Businesses and My Stores
     (buildBusinessCard, static/js/businesses.js); nothing else in the app changes.
     --bt-accent is set on #bt-root by business-theme.js. -->
<div id="business-theme-view" class="view-section bg-white min-h-screen flex justify-center">
<main id="bt-root" class="w-full max-w-[430px] bg-white min-h-screen relative pb-10">

	<header class="relative flex items-center justify-center px-14 py-3 min-h-[60px]">
		<button type="button" aria-label="Back" onclick="btBack()" class="absolute left-4 top-1/2 -translate-y-1/2 p-2 -ml-2 text-gray-900 hover:opacity-80 transition-opacity active:scale-95 duration-100">
			<svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
		</button>
		<div class="text-center">
			<h1 class="text-[18px] font-bold text-gray-900 leading-tight">Theme</h1>
			<p class="text-[13px] text-gray-500 mt-0.5">Choose your preferred accent color.</p>
		</div>
	</header>

	<!-- Accent card -->
	<section class="mx-4 mt-2 rounded-2xl border border-gray-200 bg-white shadow-sm" aria-label="Theme">
		<div class="flex items-start gap-3 px-4 pt-4">
			<i class="fa-solid fa-palette text-[20px] mt-0.5 w-6 text-center bt-accent-text"></i>
			<div class="min-w-0">
				<h2 class="text-[15px] font-semibold text-gray-900">Theme</h2>
				<p class="text-[13px] text-gray-500 mt-0.5">Adjust your business card's accent color to match your style.</p>
			</div>
		</div>

		<div id="bt-swatches" class="flex items-start justify-between px-4 pt-4 pb-4" role="radiogroup" aria-label="Accent color"></div>

		<div class="border-t border-gray-100 px-4 py-4">
			<div class="flex items-start gap-3">
				<i class="fa-solid fa-sliders text-[18px] mt-0.5 w-6 text-center text-gray-700"></i>
				<div class="min-w-0">
					<h3 class="text-[15px] font-semibold text-gray-900">Custom Theme</h3>
					<p class="text-[13px] text-gray-500 mt-0.5">Pick a custom color using the slider or color picker.</p>
				</div>
			</div>
			<div class="flex items-center gap-3 mt-3.5">
				<span id="bt-dot" class="bt-dot shrink-0" aria-hidden="true"></span>
				<input id="bt-hue" type="range" min="0" max="360" step="1" value="0" class="bt-hue-slider flex-1 min-w-0" aria-label="Custom theme color"/>
			</div>
			<label for="bt-hex" class="block text-[12px] text-gray-500 mt-3.5 mb-1.5">Hex Color</label>
			<div class="flex items-center gap-2">
				<input id="bt-hex" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="7" class="flex-1 min-w-0 h-10 px-3 rounded-xl border border-gray-200 bg-white text-[14px] text-gray-900 uppercase tracking-wide focus:outline-none" style="--tw-ring-shadow:none"/>
				<button type="button" id="bt-eyedropper" aria-label="Pick a color from the screen" onclick="btPickColor()" class="w-10 h-10 shrink-0 rounded-xl border border-gray-200 bg-white flex items-center justify-center text-gray-700 active:scale-95 transition-transform">
					<i class="fa-solid fa-eye-dropper text-[15px]"></i>
				</button>
				<input id="bt-color-fallback" type="color" class="hidden" aria-hidden="true" tabindex="-1"/>
			</div>
		</div>
	</section>

	<!-- Preview: the real Businesses / My Stores card, rendered with the chosen color
	     from the business being edited (cover, photo, name, category, location, services). -->
	<section class="mx-4 mt-4 rounded-2xl border border-gray-200 bg-white shadow-sm px-4 py-4" aria-label="Preview">
		<div class="flex items-start gap-3">
			<i class="fa-regular fa-eye text-[20px] mt-0.5 w-6 text-center bt-accent-text"></i>
			<div class="min-w-0">
				<h2 class="text-[15px] font-semibold text-gray-900">Preview</h2>
				<p class="text-[13px] text-gray-500 mt-0.5">See how your business card looks in Businesses and My Stores.</p>
			</div>
		</div>
		<div id="bt-preview" class="mt-3.5"></div>
	</section>

	<div class="mx-4 mt-4">
		<button type="button" id="bt-save" onclick="btSave()" class="w-full h-11 rounded-xl text-white font-semibold text-[15px] active:opacity-90 transition-opacity disabled:opacity-50" style="background:var(--bt-accent,#DA292E)">Save theme</button>
		<button type="button" id="bt-reset" onclick="btReset()" class="hidden w-full h-10 mt-2 rounded-xl text-[14px] font-medium text-gray-500 active:opacity-80">Reset to default</button>
	</div>
</main>
</div>
<!-- END: Business Theme View -->
