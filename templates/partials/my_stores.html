<!-- BEGIN: My Stores View -->
<!-- Opened by the "My Stores" FAB on the Businesses screen (openMyStores(),
     static/js/business-stores.js). Lists the businesses the user created with
     the Create Business wizard, using the same header and the same card
     markup (#business-card-template in businesses.html) as the Businesses
     list. Frontend only: the list lives in memory for the session. -->
<div id="my-stores-view" class="view-section bg-white min-h-screen relative">
	<header class="bg-white sticky top-0 z-10 w-full shadow-sm">
		<div class="flex items-center gap-3 px-4 py-3.5">
			<button type="button" aria-label="Back" onclick="myStoresBack()" class="p-1 -ml-1 text-gray-900 hover:opacity-80 transition-opacity active:scale-95 duration-100">
				<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</button>
			<h1 class="text-lg font-bold text-gray-900">My Stores</h1>
		</div>
	</header>

	<!-- Render target: one cloned #business-card-template per store -->
	<main id="my-stores-list" class="px-4 pt-4 space-y-4 pb-24"></main>

	<!-- Empty state: shown while the user has not created a business -->
	<div id="my-stores-empty" class="hidden px-8 pt-24 text-center">
		<span class="mx-auto w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-400">
			<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 6 0 2.5 2.5 0 0 0 5 0"></path><path d="M5 12v8h14v-8"></path><path d="M10 20v-4h4v4"></path></svg>
		</span>
		<p class="text-[17px] font-semibold text-gray-900 mt-4">No stores yet</p>
		<p class="text-[14px] text-gray-500 mt-1">Businesses you create will show up here.</p>
		<button type="button" onclick="openBusinessCreate()" class="mt-5 h-11 px-6 rounded-xl bg-brand-red text-white font-semibold text-[15px] active:opacity-90 transition-opacity">Create a business</button>
	</div>

	<!-- Footer divider (same as the Businesses list) -->
	<footer id="my-stores-footer" class="hidden mt-8 flex items-center justify-center mb-4">
		<div class="h-px bg-gray-100 w-12"></div>
		<span class="text-sm text-gray-400 px-4">No more stores</span>
		<div class="h-px bg-gray-100 w-12"></div>
	</footer>
</div>
<!-- END: My Stores View -->
