<!-- BEGIN: Settings View -->
<!-- Opened from the profile's settings button and the side nav (openSettingsView in
     static/js/settings.js); the back arrow returns to the screen it came from.
     Rows are wired in settings.js by data-settings-action. -->
<div id="settings-view" class="view-section bg-white min-h-screen flex justify-center">
<main class="w-full max-w-[430px] bg-white min-h-screen relative settings-main">

	<!-- BEGIN: Banner -->
	<header class="settings-banner settings-banner--compact">
		<svg class="settings-banner-arcs" viewBox="0 0 430 160" preserveAspectRatio="xMaxYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<circle cx="478" cy="-20" r="300"></circle>
			<circle cx="518" cy="-80" r="272"></circle>
		</svg>
		<button type="button" id="settings-back-btn" class="settings-back-btn" aria-label="Back" onclick="closeSettingsView()">
			<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
		</button>
		<h1 class="settings-title">Settings</h1>
	</header>
	<!-- END: Banner -->

	<!-- BEGIN: Settings list -->
	<section class="settings-section" aria-label="Settings">
		<!-- Pill search bar; tapping it opens the search screen (settings_search.html). -->
		<button type="button" id="settings-search-trigger" class="settings-search" aria-label="Search settings" onclick="openSettingsSearch()">
			<svg class="settings-search-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"></circle><path d="m20.5 20.5-5-5"></path></svg>
			<span class="settings-search-placeholder">Search settings</span>
		</button>
		<div class="settings-list">
			<button type="button" id="settings-row-account" class="settings-row" data-settings-action="account">
				<svg class="settings-row-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
				<span class="settings-row-text">
					<span class="settings-row-label">Account information</span>
					<span class="settings-row-desc">Manage your account information, download your data, or review your deactivation options.</span>
				</span>
			</button>
			<button type="button" id="settings-row-security" class="settings-row" data-settings-action="security">
				<svg class="settings-row-icon" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M128,112a28,28,0,0,0-8,54.83V184a8,8,0,0,0,16,0V166.83A28,28,0,0,0,128,112Zm0,40a12,12,0,1,1,12-12A12,12,0,0,1,128,152Zm80-72H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Z"></path></svg>
				<span class="settings-row-text">
					<span class="settings-row-label">Security</span>
					<span class="settings-row-desc">Protect your account by managing your password, authentication methods, active sessions, and login preferences.</span>
				</span>
			</button>
			<button type="button" id="settings-row-privacy" class="settings-row" data-settings-action="privacy">
				<svg class="settings-row-icon" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M208,40H48A16,16,0,0,0,32,56v56c0,52.72,25.52,84.67,46.93,102.19,23.06,18.86,46,25.26,47,25.53a8,8,0,0,0,4.2,0c1-.27,23.91-6.67,47-25.53C198.48,196.67,224,164.72,224,112V56A16,16,0,0,0,208,40Zm0,72c0,37.07-13.66,67.16-40.6,89.42A129.3,129.3,0,0,1,128,223.62a128.25,128.25,0,0,1-38.92-21.81C61.82,179.51,48,149.3,48,112l0-56,160,0ZM82.34,141.66a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32l-56,56a8,8,0,0,1-11.32,0Z"></path></svg>
				<span class="settings-row-text">
					<span class="settings-row-label">Privacy and safety</span>
					<span class="settings-row-desc">Control who can see your information, manage your interactions, visibility and preferences for a more secure experience.</span>
				</span>
			</button>
			<button type="button" id="settings-row-payment" class="settings-row" data-settings-action="payment">
				<svg class="settings-row-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.5 4.5h15A2.25 2.25 0 0121.75 6.75v10.5A2.25 2.25 0 0119.5 19.5h-15a2.25 2.25 0 01-2.25-2.25V6.75A2.25 2.25 0 014.5 4.5z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2.25 9.75h19.5M6 14.25h4.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
				<span class="settings-row-text">
					<span class="settings-row-label">Payment methods</span>
					<span class="settings-row-desc">Add, manage, or remove payment methods, update your billing information, and choose your preferred payment option for future transactions.</span>
				</span>
			</button>
			<button type="button" id="settings-row-notifications" class="settings-row" data-settings-action="notifications">
				<svg class="settings-row-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path></svg>
				<span class="settings-row-text">
					<span class="settings-row-label">Notifications</span>
					<span class="settings-row-desc">Customize alerts for messages, updates, activity, and other important events.</span>
				</span>
			</button>
			<button type="button" id="settings-row-appearance" class="settings-row" data-settings-action="appearance">
				<svg class="settings-row-icon" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M80,40a40,40,0,1,0,40,40A40,40,0,0,0,80,40Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,80,104Zm96,16a40,40,0,1,0-40-40A40,40,0,0,0,176,120Zm0-64a24,24,0,1,1-24,24A24,24,0,0,1,176,56ZM80,136a40,40,0,1,0,40,40A40,40,0,0,0,80,136Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,80,200Zm136-24a8,8,0,0,1-8,8H184v24a8,8,0,0,1-16,0V184H144a8,8,0,0,1,0-16h24V144a8,8,0,0,1,16,0v24h24A8,8,0,0,1,216,176Z"></path></svg>
				<span class="settings-row-text">
					<span class="settings-row-label">Appearance and display preferences</span>
					<span class="settings-row-desc">Manage how Beebo content is displayed to you.</span>
				</span>
			</button>
		</div>
	</section>
	<!-- END: Settings list -->

	<!-- BEGIN: Version -->
	<footer class="settings-version">Version 1.0</footer>
	<!-- END: Version -->

</main>

	<!-- BEGIN: Appearance sheet -->
	<div id="settings-appearance-backdrop" class="hidden fixed inset-0 z-40 bg-black/20" onclick="closeSettingsSheet()"></div>
	<div id="settings-appearance-sheet" class="hidden fixed left-0 right-0 bottom-0 z-50 bg-white rounded-t-[24px] shadow-[0_-8px_24px_rgba(0,0,0,0.12)] pt-2 pb-6 max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="Appearance">
		<div class="w-10 h-1 rounded-full bg-gray-200 mx-auto mb-3"></div>
		<h3 class="px-7 pb-2 text-[17px] font-semibold text-gray-900">Appearance</h3>
		<div class="px-3" role="radiogroup" aria-label="Theme">
			<button type="button" id="settings-theme-light" class="settings-theme-option" role="radio" aria-checked="false" data-theme-choice="light">
				<span class="settings-theme-label">Light</span>
				<svg class="settings-theme-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
			</button>
			<button type="button" id="settings-theme-dark" class="settings-theme-option" role="radio" aria-checked="false" data-theme-choice="dark">
				<span class="settings-theme-label">Dark</span>
				<svg class="settings-theme-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
			</button>
		</div>
	</div>
	<!-- END: Appearance sheet -->
</div>
<!-- END: Settings View -->
