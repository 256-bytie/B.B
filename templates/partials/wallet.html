<!-- BEGIN: Wallet View -->
<div id="wallet-view" class="view-section bg-white min-h-screen relative">
	<!-- BEGIN: Header -->
	<header class="bg-white sticky top-0 z-10 w-full">
		<div class="flex items-center gap-3 px-4 py-3.5 max-w-[640px] mx-auto">
			<button type="button" aria-label="Back" onclick="closeWalletView()" class="p-1 -ml-1 text-gray-900 hover:opacity-80 transition-opacity active:scale-95 duration-100">
				<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</button>
			<h1 class="text-[22px] font-bold text-gray-900">Wallet</h1>
		</div>
	</header>
	<!-- END: Header -->

	<main class="px-4 pb-24 max-w-[640px] mx-auto">
		<!-- Shown only when the initial load fails (see wallet.js renderWallet) -->
		<div id="wallet-error" class="hidden">
			<div class="flex flex-col items-center text-center px-6 pt-24">
				<div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-4">
					<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" stroke-linecap="round" stroke-linejoin="round"></path>
						<path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
				</div>
				<p class="text-[17px] font-semibold text-gray-900">Couldn't load your wallet</p>
				<p class="text-[14px] text-gray-500 mt-1">Check your connection and try again.</p>
				<button type="button" onclick="loadWallet()" class="wallet-primary-btn mt-5 h-11 px-6 rounded-full text-[15px] font-semibold active:scale-[0.98] transition-transform duration-100">Try again</button>
			</div>
		</div>

		<div id="wallet-content" class="space-y-4">
			<!-- BEGIN: Balance Card -->
			<section aria-label="Credit balance" class="rounded-2xl bg-gray-50 px-5 py-5 flex items-center justify-between gap-4">
				<div class="min-w-0">
					<div class="flex items-center gap-3">
						<svg class="w-7 h-7 shrink-0 text-gray-900" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
							<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" stroke-linecap="round" stroke-linejoin="round"></path>
							<path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" stroke-linecap="round" stroke-linejoin="round"></path>
						</svg>
						<span class="text-[16px] font-medium text-gray-500">Your Credits</span>
					</div>
					<div id="wallet-balance" class="mt-3 text-[44px] leading-none font-extrabold text-gray-900 tracking-tight" aria-live="polite"></div>
					<p class="mt-2.5 text-[15px] text-gray-500">Available credits</p>
				</div>
				<!-- Top-ups need a payment provider that isn't wired up yet, so this
				     uses the app's standard "Coming soon" toast rather than pretending. -->
				<button type="button" onclick="showToast('Coming soon')" class="wallet-primary-btn shrink-0 h-12 pl-4 pr-5 rounded-2xl flex items-center gap-2 text-[16px] font-semibold active:scale-[0.98] transition-transform duration-100">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<path d="M5 12h14M12 5v14" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
					<span>Top Up</span>
				</button>
			</section>
			<!-- END: Balance Card -->

			<!-- BEGIN: Monthly Free Credits Card -->
			<section aria-label="Monthly free credits" class="rounded-2xl border border-gray-100 px-4 py-4">
				<div class="flex items-center gap-4">
					<svg class="w-8 h-8 shrink-0 text-gray-900" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<rect x="3" y="8" width="18" height="4" rx="1"></rect>
						<path d="M12 8v13" stroke-linecap="round" stroke-linejoin="round"></path>
						<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" stroke-linecap="round" stroke-linejoin="round"></path>
						<path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
					<div class="flex-1 min-w-0">
						<h2 class="text-[18px] font-bold text-gray-900 leading-snug">Monthly Free Credits</h2>
						<p id="wallet-monthly-subtitle" class="text-[15px] text-gray-500"></p>
					</div>
					<button type="button" id="wallet-claim-btn" onclick="claimWalletMonthlyCredits()" class="shrink-0" disabled></button>
				</div>
				<div class="mt-3.5 pt-3.5 border-t border-gray-100 flex items-center gap-2.5 text-gray-500">
					<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<circle cx="12" cy="12" r="10"></circle>
						<path d="M12 16v-4M12 8h.01" stroke-linecap="round" stroke-linejoin="round"></path>
					</svg>
					<p id="wallet-monthly-note" class="text-[14px]"></p>
				</div>
			</section>
			<!-- END: Monthly Free Credits Card -->

			<!-- BEGIN: History -->
			<section aria-label="Transaction history" class="pt-3">
				<div class="flex items-center justify-between mb-1">
					<h2 class="flex items-center gap-3 text-[22px] font-bold text-gray-900">
						<svg class="w-7 h-7 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
							<circle cx="12" cy="12" r="10"></circle>
							<path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"></path>
						</svg>
						History
					</h2>
					<div id="wallet-see-all-wrap" class="hidden">
						<button type="button" id="wallet-see-all" onclick="toggleWalletHistoryExpanded()" class="flex items-center gap-1 text-[15px] font-medium text-gray-500 hover:text-gray-700">
							<span id="wallet-see-all-label">See all</span>
							<svg id="wallet-see-all-chevron" class="w-4 h-4 transition-transform duration-150" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
								<path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"></path>
							</svg>
						</button>
					</div>
				</div>
				<ul id="wallet-history-list"></ul>
				<div id="wallet-history-footer"></div>
			</section>
			<!-- END: History -->
		</div>
	</main>
</div>
<!-- END: Wallet View -->
