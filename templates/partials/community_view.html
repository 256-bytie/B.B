<!-- BEGIN: Community View -->
<!-- Single screen for both a member and the creator - renderCommunityHeader()
     in community.js swaps the action button (Join / Joined / Edit pencil) from
     membership.role in GET /api/communities/<slug>, and has no inline composer
     (matches the reference). -->
<div id="community-view" class="view-section bg-white min-h-screen flex justify-center">
<main class="w-full max-w-[640px] bg-white min-h-screen flex flex-col relative pb-[calc(var(--bottom-nav-h)+env(safe-area-inset-bottom,0px)+16px)]">

	<!-- Error-state header only: in the loaded state the back/search/more buttons float over the banner. -->
	<div id="community-error" class="hidden">
		<div class="px-4 h-14 flex items-center">
			<button type="button" aria-label="Back" onclick="closeCommunityView()" class="p-2 -ml-2 text-gray-800 hover:opacity-80 transition-opacity active:scale-95 duration-100">
				<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
			</button>
		</div>
		<div class="flex flex-col items-center text-center px-6 pt-16">
			<div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-4">
				<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</div>
			<p id="community-error-title" class="text-[17px] font-semibold text-gray-900">Couldn't load this community</p>
			<p id="community-error-detail" class="text-[14px] text-gray-500 mt-1">Check your connection and try again.</p>
			<button type="button" id="community-error-retry" onclick="loadCommunityView()" class="h-11 px-6 rounded-full bg-brand-red text-white text-[15px] font-semibold mt-5 active:scale-[0.98] transition-transform duration-100">Try again</button>
		</div>
	</div>

	<div id="community-content" class="hidden">
		<!-- BEGIN: Banner (back / search / more float over it) -->
		<div id="community-banner" class="relative overflow-hidden flex items-center justify-center" style="aspect-ratio: 32 / 9; max-height: 150px; width: 100%; background: linear-gradient(180deg, #2E86EC 0%, #5AA3F4 55%, #8CC3FB 100%);">
			<img id="community-banner-img" alt="" class="hidden absolute inset-0 w-full h-full object-cover" src="">
			<button type="button" aria-label="Back" onclick="closeCommunityView()" class="absolute top-3 left-3 w-9 h-9 rounded-full flex items-center justify-center text-white active:scale-95 transition-transform duration-100" style="background: rgba(10,35,95,0.45);">
				<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
			</button>
			<div class="absolute top-3 right-3 flex items-center gap-2">
				<button type="button" aria-label="Search" onclick="showToast('Coming soon')" class="w-9 h-9 rounded-full flex items-center justify-center text-white active:scale-95 transition-transform duration-100" style="background: rgba(10,35,95,0.45);">
					<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.25" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3" stroke-linecap="round"></path></svg>
				</button>
				<button type="button" aria-label="More" onclick="showToast('Coming soon')" class="w-9 h-9 rounded-full flex items-center justify-center text-white active:scale-95 transition-transform duration-100" style="background: rgba(10,35,95,0.45);">
					<svg class="w-[18px] h-[18px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
				</button>
			</div>
			<svg id="community-banner-icon" class="w-14 h-14 text-white" fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"></svg>
		</div>

		<!-- BEGIN: Identity -->
		<div class="px-4 pt-4 pb-4">
			<div class="flex items-center gap-3">
				<div id="community-icon" class="w-12 h-12 rounded-full border border-gray-100 overflow-hidden flex items-center justify-center text-[26px] shrink-0 bg-gray-100"></div>
				<div class="flex-1 min-w-0">
					<h2 id="community-name" class="text-[19px] font-bold text-gray-900 truncate leading-tight">&nbsp;</h2>
					<p id="community-meta" class="text-gray-500 text-[14px] mt-0.5 flex items-center gap-2 flex-wrap">
						<span id="community-meta-members">&nbsp;</span>
						<span id="community-meta-online" class="hidden items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-green-500"></span><span id="community-meta-online-text"></span></span>
					</p>
				</div>
				<div class="flex items-center gap-2 shrink-0">
					<button type="button" id="community-action-btn" onclick="communityHandleActionBtn()" class="h-9 rounded-full flex items-center justify-center transition-colors active:scale-[0.98] duration-100"></button>
					<button type="button" aria-label="Notifications" onclick="showToast('Coming soon')" class="w-9 h-9 rounded-full border border-gray-200 flex items-center justify-center text-gray-700 hover:bg-gray-50 transition-colors active:scale-[0.98] duration-100">
						<svg class="w-[18px] h-[18px]" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"></path></svg>
					</button>
				</div>
			</div>
			<p id="community-description" class="text-gray-500 text-[15px] leading-snug mt-3"></p>
		</div>
		<!-- END: Identity -->

		<!-- BEGIN: Tabs (Feed / About + sort and layout controls) -->
		<div class="flex items-center px-2 py-2 border-y border-gray-100 sticky top-0 bg-white z-[5]">
			<button type="button" class="community-tab h-9 px-4 rounded-full text-[14px] font-semibold bg-gray-100 text-gray-900" data-tab="posts" onclick="switchCommunityTab('posts')">Feed</button>
			<button type="button" class="community-tab h-9 px-4 rounded-full text-[14px] font-medium text-gray-500" data-tab="about" onclick="switchCommunityTab('about')">About</button>
			<div id="community-feed-controls" class="ml-auto flex items-center">
				<div class="relative">
					<button type="button" id="community-sort-btn" aria-label="Sort posts" aria-haspopup="listbox" aria-expanded="false" onclick="communityToggleSortMenu(event)" class="h-9 pl-3 pr-2 rounded-full flex items-center gap-1 text-[14px] font-medium text-gray-500 active:opacity-70 transition-colors">
					<span id="community-sort-label">Best</span>
						<svg id="community-sort-chevron" class="w-4 h-4 transition-transform duration-150" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
					</button>
					<div id="community-sort-menu" role="listbox" class="hidden absolute left-0 top-full mt-1.5 w-[74px] max-w-[calc(100vw-16px)] rounded-2xl bg-white border border-gray-100 shadow-xl overflow-hidden z-30">
						<p class="pl-4 pr-0 pt-3.5 pb-2.5 text-[14px] font-semibold text-gray-500 whitespace-nowrap">Sort by</p>
						<button type="button" role="option" data-sort="best" aria-selected="true" onclick="communitySelectSort('best')" class="community-sort-option w-full text-left px-4 py-3.5 text-[16px] text-gray-900 bg-gray-100">Best</button>
						<button type="button" role="option" data-sort="hot" aria-selected="false" onclick="communitySelectSort('hot')" class="community-sort-option w-full text-left px-4 py-3.5 text-[16px] text-gray-900">Hot</button>
						<button type="button" role="option" data-sort="new" aria-selected="false" onclick="communitySelectSort('new')" class="community-sort-option w-full text-left px-4 py-3.5 text-[16px] text-gray-900">New</button>
					</div>
				</div>
				<span class="w-px h-6 bg-gray-200 mx-2"></span>
				<button type="button" aria-label="Change layout" onclick="showToast('Coming soon')" class="h-9 pl-1 pr-2 flex items-center gap-1 text-gray-500 active:opacity-70">
					<svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M3.5 12h17" stroke-linecap="round"></path></svg>
					<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
				</button>
			</div>
		</div>
		<!-- END: Tabs -->

		<!-- BEGIN: Posts tab -->
		<div id="community-panel-posts" class="community-panel">
			<div id="community-posts-loading" class="hidden py-14 flex items-center justify-center text-gray-400">
				<svg class="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
					<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
				</svg>
			</div>
			<div id="community-posts-empty" class="hidden flex-col items-center text-center px-8 py-16">
				<svg class="w-10 h-10 text-gray-300 mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM21 12c0 4.556-4.03 8.25-9 8.25a9.76 9.76 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<p class="text-[15px] font-semibold text-gray-900">No posts yet</p>
				<p class="text-[13px] text-gray-500 mt-1">Be the first to post in this community.</p>
			</div>
			<div id="community-posts-error" class="hidden flex-col items-center text-center px-8 py-16">
				<p class="text-[15px] font-semibold text-gray-900">Couldn't load posts</p>
				<p id="community-posts-error-detail" class="text-[13px] text-gray-500 mt-1">Check your connection and try again.</p>
				<button type="button" onclick="loadCommunityPosts(true)" class="h-10 px-5 rounded-full bg-brand-red text-white text-[14px] font-semibold mt-4 active:scale-[0.98] transition-transform duration-100">Try again</button>
			</div>
			<div id="community-posts-list" class="divide-y divide-gray-100"></div>
			<div id="community-posts-footer" class="hidden"></div>
		</div>
		<!-- END: Posts tab -->

		<!-- BEGIN: About tab (fields come from GET /api/communities/<slug>) -->
		<div id="community-panel-about" class="community-panel hidden px-4 py-5">
			<h3 class="text-[13px] font-semibold text-gray-400 tracking-wide mb-2">DESCRIPTION</h3>
			<p id="community-about-description" class="text-[14px] text-gray-800 leading-relaxed"></p>
			<h3 class="text-[13px] font-semibold text-gray-400 tracking-wide mt-6 mb-2">COMMUNITY TYPE</h3>
			<p id="community-about-type" class="text-[14px] text-gray-800"></p>
			<h3 class="text-[13px] font-semibold text-gray-400 tracking-wide mt-6 mb-2">CREATED</h3>
			<p id="community-about-created" class="text-[14px] text-gray-800"></p>
		</div>
		<!-- END: About tab -->

	</div>
</main>
</div>
<!-- END: Community View -->
